<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speaking Task</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="speak.css" />
</head>

<body>
    <main class="speaking-main">
        <section class="speaking-box">
            <h2 class="speaking-title">AI Voice Assistant</h2>
            <p class="speaking-text">
                O'qilishi kerak bo'lgan matnni kiriting va tinglash tugmasini bosing.
            </p>
            
            <div class="textarea-wrapper">
                <textarea id="speakTextInput" class="speak-textarea" placeholder="Bu yerga matn kiriting..." rows="4"></textarea>
            </div>

            <div class="audio-controls">
                <button class="audio-button" id="audioButton" type="button">
                    <span class="icon">🎙️</span> Tinglash
                </button>
            </div>
            
            <div id="loadingStatus" class="loading-status" style="display: none;">
                <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                Ovoz tayyorlanmoqda...
            </div>
        </section>
    </main>

    <script src="../shared/config.js"></script>
    <script src="speak.js"></script>
</body>

</html>
