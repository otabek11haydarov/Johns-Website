<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flashcard Task</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="fleshkard.css" />
</head>

<body>
    <main class="speaking-main">
        <section class="flashcard-section">
            <div class="flashcard-shell">
                <div class="flashcard" id="flashcard" aria-live="polite">
                    <div class="flashcard-face flashcard-front">
                        <div class="flashcard-badge-row">
                            <span class="flashcard-label">Word</span>
                            <span class="flashcard-counter" id="cardCounter">1 / 3</span>
                        </div>
                        <h2 class="flashcard-word" id="flashcardWord">Beautiful</h2>
                        <p class="flashcard-hint">Choose if you know the word or want the meaning.</p>
                    </div>
                    <div class="flashcard-face flashcard-back">
                        <span class="flashcard-label">Description</span>
                        <p class="flashcard-description" id="flashcardDescription">
                            Very attractive or pleasing to look at.
                        </p>
                        <p class="flashcard-example-title">Example</p>
                        <p class="flashcard-example" id="flashcardExample">
                            She wore a beautiful dress to the party.
                        </p>
                    </div>
                </div>
                <div class="flashcard-inner-actions">
                    <div class="flashcard-footer">
                        <button class="flashcard-control prev-word-btn" id="prevWordBtn" type="button" disabled>&larr; Ortga</button>
                        <button class="flashcard-control rotate-button" id="rotatebtn" type="button">Rotate</button>
                        <button class="flashcard-control next-word-btn" id="nextWordBtn" type="button">Keyingi so'z &rarr;</button>
                    </div>
                </div>
            </div>
            <div class="flashcard-actions">
                <button class="flashcard-button know-button" id="knowButton" type="button">
                    I know
                </button>
                <button class="flashcard-button dont-know-button" id="dontKnowButton" type="button">
                    I don't know
                </button>
            </div>
        </section>
    </main>

    <script src="fleshkard.js"></script>
</body>

</html>
