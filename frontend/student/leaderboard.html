<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaderboard - Student Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="student.css" />
    <link rel="stylesheet" href="leaderboard.css" />
</head>

<body>
    <div class="student-app">
        <!-- Sidebar will be identical to student.html (using JS to inject or just copy for now) -->
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <div class="brand-mark">J</div>
                <div>
                    <strong>Student Portal</strong>
                    <span>Johns LMS</span>
                </div>
            </div>

            <nav class="nav-block" aria-label="Main navigation">
                <a class="nav-item" href="student.html">
                    <span class="icon grid-icon"></span>
                    <span>Dashboard</span>
                </a>
                <a class="nav-item active" href="leaderboard.html">
                    <span class="icon star-icon"></span>
                    <span>Leaderboard</span>
                </a>
            </nav>

            <div class="nav-heading">Academics</div>
            <nav class="nav-block" aria-label="Academics">
                <a class="nav-item" href="#" data-section="attendance">
                    <span class="icon user-icon"></span>
                    <span>Attendance</span>
                </a>
            </nav>

            <div class="nav-heading">My Learning</div>
            <nav class="nav-block" aria-label="Learning">
                <a class="nav-item" href="#" data-section="assignments">
                    <span class="icon clipboard-icon"></span>
                    <span>My Assignments</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a class="nav-item" href="../auth/login.html" onclick="localStorage.removeItem('token')">
                    <span class="icon logout-icon"></span>
                    <span>Logout</span>
                </a>
                <button class="nav-item button-nav" id="collapseBtn" type="button">
                    <span class="icon chevron-icon"></span>
                    <span>Collapse</span>
                </button>
            </div>
        </aside>

        <div class="sidebar-scrim" id="sidebarScrim"></div>

        <div class="content">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="menu-btn" id="menuBtn" type="button" aria-label="Open menu">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                    <div class="breadcrumb">
                        <a href="student.html" style="color: inherit; text-decoration: none; transition: color 0.2s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='inherit'">Student Portal</a>
                        <span class="separator">></span>
                        <strong id="breadcrumbCurrent">Leaderboard</strong>
                    </div>
                </div>

                <div class="topbar-actions">
                    <button class="round-btn" id="themeToggle" type="button" aria-label="Switch to light mode"
                        title="Switch to light mode">
                        <span class="theme-icon sun-icon" id="themeIcon"></span>
                    </button>
                    <div class="avatar" id="header-avatar">--</div>
                    <a class="round-btn" href="../auth/login.html" aria-label="Logout" onclick="localStorage.removeItem('token')">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                    </a>
                </div>
            </header>

            <main class="dashboard">
                <div class="leaderboard-container">
                <h1 class="page-title">Reyting</h1>
                
                <!-- Tabs -->
                <div class="tabs-container" id="levelTabs">
                    <!-- Dynamic tabs will be inserted here -->
                    <button class="tab-btn active" data-level="Umumiy">Umumiy</button>
                </div>

                <!-- Podium Section -->
                <div class="podium-wrapper" id="podiumContainer">
                    <!-- Podium will be dynamically generated here -->
                </div>

                <!-- List Section -->
                <div class="list-wrapper">
                    <ol class="leaderboard-list" id="leaderboardList">
                        <!-- List items will be dynamically generated here -->
                    </ol>
                </div>

                <!-- Pagination -->
                <div class="pagination-controls">
                    <button id="prevBtn" class="page-btn" disabled>← Oldingi</button>
                    <span id="pageInfo">Sahifa 1 / 1</span>
                    <button id="nextBtn" class="page-btn" disabled>Keyingi →</button>
                </div>
            </div>
            </main>
        </div>
    </div>

    <script src="../shared/config.js"></script>
    <script src="leaderboard.js"></script>
</body>

</html>
