<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Task</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="test.css" />
</head>

<body>
    <main class="test-main">
        <section class="test-panel">
            <div class="test-panel-header d-flex justify-content-between align-items-center mb-3">
                <div>
                    <span class="test-eyebrow">GRAMMAR ASSESSMENT</span>
                    <h2 class="test-title" style="margin:0;">Grammar & Vocabulary Test</h2>
                </div>
                <div class="timer-badge-pill" id="timerBadge">
                    ⏱️ <span id="timerDisplay">45:00</span>
                </div>
            </div>

            <div class="test-question-block">
                <label class="question-label" for="questionText">Sentence / Question Text</label>
                <div class="question-text" id="questionText">
                    She ____ to school every day.
                </div>
            </div>

            <div class="test-options-block">
                <div class="options-heading">Options (Select the correct one)</div>

                <label class="option-row">
                    <input type="radio" name="answer" value="A" />
                    <span class="option-letter">A)</span>
                    <span class="option-box">go</span>
                </label>

                <label class="option-row">
                    <input type="radio" name="answer" value="B" />
                    <span class="option-letter">B)</span>
                    <span class="option-box">goes</span>
                </label>

                <label class="option-row">
                    <input type="radio" name="answer" value="C" />
                    <span class="option-letter">C)</span>
                    <span class="option-box">going</span>
                </label>

                <label class="option-row">
                    <input type="radio" name="answer" value="D" />
                    <span class="option-letter">D)</span>
                    <span class="option-box">gone</span>
                </label>
            </div>

            <div class="test-progress-bar">
                <div class="progress-info">
                    <span>Savol: <strong id="currentQuestionNum">1</strong> / <span id="totalQuestionsNum">5</span></span>
                    <span class="progress-status">Belgilandi: <strong id="answeredCount">0</strong> / <span id="totalCount">5</span></span>
                </div>
                <div class="question-nav-pills" id="questionNavPills">
                    <!-- Injected by JS -->
                </div>
            </div>

            <div class="test-actions">
                <button class="test-btn test-btn-ghost" type="button" id="prevBtn" disabled>Ortga</button>
                <button class="test-btn test-btn-ghost" type="button" id="clearBtn">Tozalash</button>
                <button class="test-btn test-btn-secondary" type="button" id="nextBtn">Keyingisi</button>
                <button class="test-btn test-btn-finish" type="button" id="finishBtn" disabled>Finish</button>
            </div>
        </section>

        <div class="test-results-overlay" id="resultsOverlay" style="display: none;">
            <div class="test-results-card">
                <div class="results-icon">🏆</div>
                <h2>Test Natijasi</h2>
                <div class="results-score" id="resultsScore">0 / 0</div>
                <p class="results-percentage" id="resultsPercentage">Aniqlik: 0%</p>
                <button class="test-btn test-btn-finish" type="button" id="restartBtn">Qayta ishlash</button>
            </div>
        </div>
    </main>

    <script src="test.js"></script>
</body>

</html>
